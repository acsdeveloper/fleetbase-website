name: Live Deployment via SSM

on:
    workflow_dispatch:
      inputs:
        branch:
          description: 'Branch to deploy'
          required: true
          default: 'main'

jobs:
    deploy:
      runs-on: ubuntu-latest
      if: github.event.inputs.branch == 'main'
      environment: production
      steps:
        - name: Checkout repository at requested branch
          uses: actions/checkout@v6
          with:
            ref: ${{ github.event.inputs.branch }}

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Deploy via SSM
          run: |
            set -euo pipefail
            SHA="${{ github.sha }}"
            GA_ID="${{ secrets.GA_MEASUREMENT_ID }}"  
            INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="sudo -u ubuntu /opt/deploy/deploy.sh $SHA $GA_ID" \
              --query "Command.CommandId" \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            # Poll until the command finishes (max ~5 minutes)
            for i in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" --output text 2>/dev/null || echo "Pending")

              if [[ "$STATUS" != "Pending" && "$STATUS" != "InProgress" && "$STATUS" != "Delayed" ]]; then
                break
              fi
              sleep 5
            done

            echo "=== deploy.sh stdout ==="
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text

            echo "=== deploy.sh stderr ==="
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text

            if [[ "$STATUS" != "Success" ]]; then
              echo "Deploy failed with SSM status: $STATUS"
              exit 1
            fi  
            echo "Deploy succeeded."
